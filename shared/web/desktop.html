<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-Desk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e2e;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <script>
    (function() {
      const session = sessionStorage.getItem('easedesk_session');
      const pw = sessionStorage.getItem('easedesk_pass');

      if (!session || !pw) {
        // Cold refresh or missing session — go to login
        window.location.replace('/');
        return;
      }

      // Clear session from storage immediately for security
      sessionStorage.removeItem('easedesk_session');
      sessionStorage.removeItem('easedesk_user');
      sessionStorage.removeItem('easedesk_pass');

      // Create an iframe to hold noVNC.
      const iframe = document.createElement('iframe');
      
      // Allow fullscreen and clipboard operations for the VNC session
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
      
      // Construct the internal URL for noVNC (websockify proxy)
      const u = new URL(window.location.protocol + '//' + window.location.host + '/novnc/vnc.html');
      u.searchParams.set('autoconnect', 'true');
      u.searchParams.set('resize', 'scale');
      u.searchParams.set('password', pw);
      u.searchParams.set('path', 'websockify');
      
      iframe.src = u.toString();
      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
