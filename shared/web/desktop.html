<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-Desk | Connecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e2e;
      font-family: 'Outfit', sans-serif;
      color: #cdd6f4;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(137,180,250,0.2);
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #a6adc8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Connecting to your desktop...</p>
  <script>
    // desktop.html is a transit page. It reads the credentials stored by
    // login.html in sessionStorage, then does a full-page navigation to
    // /kasmvnc/ with credentials embedded in the URL so the browser
    // caches Basic Auth for this origin.
    //
    // On refresh (no sessionStorage) it clears cached auth and returns to login.
    const session = sessionStorage.getItem('easedesk_session');
    if (!session) {
      // Cold refresh or new tab — kill cached Basic Auth and go to login
      const x = new XMLHttpRequest();
      x.open('GET', '/auth_check', true);
      x.setRequestHeader('Authorization', 'Basic ' + btoa('logout:' + Math.random()));
      x.onreadystatechange = function() {
        if (x.readyState === 4) window.location.replace('/');
      };
      x.onerror = function() { window.location.replace('/'); };
      x.send();
    } else {
      // Session alive — retrieve stored credentials and navigate directly to VNC
      const u = sessionStorage.getItem('easedesk_user') || '';
      const p = sessionStorage.getItem('easedesk_pass') || '';
      sessionStorage.removeItem('easedesk_session');
      sessionStorage.removeItem('easedesk_user');
      sessionStorage.removeItem('easedesk_pass');
      // Full-page redirect embeds credentials in URL so browser sends Basic Auth
      const dest = window.location.protocol + '//' +
        encodeURIComponent(u) + ':' + encodeURIComponent(p) +
        '@' + window.location.host + '/kasmvnc/';
      window.location.replace(dest);
    }
  </script>
</body>
</html>
