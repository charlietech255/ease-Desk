<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>ease-Desk | Auth Gateway</title>
 <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
 <style>
  :root {
   --bg-color: #050505;
   --terminal-bg: #0a0a0f;
   --primary: #00ff41;
   --primary-glow: rgba(0, 255, 65, 0.4);
   --primary-dim: rgba(0, 255, 65, 0.15);
   --text-main: #00ff41;
   --text-muted: #2f8e4b;
   --error: #ff003c;
   --border-color: #1a4d2e;
  }

  * {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
  }

  body, html {
   height: 100%;
   font-family: 'Fira Code', monospace;
   background-color: var(--bg-color);
   color: var(--text-main);
   overflow: hidden;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
  }

  /* Scanline effect */
  body::before {
   content: " ";
   display: block;
   position: absolute;
   top: 0;
   left: 0;
   bottom: 0;
   right: 0;
   background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
   z-index: 100;
   background-size: 100% 2px, 3px 100%;
   pointer-events: none;
  }

  /* Glitchy CRT flicker */
  @keyframes flicker {
   0% { opacity: 0.95; }
   5% { opacity: 0.85; }
   10% { opacity: 0.95; }
   15% { opacity: 1; }
   50% { opacity: 0.98; }
   100% { opacity: 1; }
  }

  .login-wrapper {
   position: relative;
   z-index: 10;
   width: 100%;
   max-width: 500px;
   padding: 0 20px;
   animation: flicker 0.15s infinite;
  }

  .login-card {
   background: var(--terminal-bg);
   border: 1px solid var(--border-color);
   padding: 40px;
   box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px var(--primary-dim);
   position: relative;
  }
  
  .login-card::before {
   content: '';
   position: absolute;
   top: -2px; left: -2px; right: -2px; bottom: -2px;
   background: linear-gradient(45deg, transparent 40%, var(--primary-dim) 50%, transparent 60%);
   z-index: -1;
   animation: borderGlow 4s linear infinite;
  }

  @keyframes borderGlow {
   0% { background-position: 0% 0%; }
   100% { background-position: 100% 100%; }
  }

  /* Terminal Header */
  .terminal-header {
   display: flex;
   justify-content: space-between;
   border-bottom: 1px solid var(--border-color);
   padding-bottom: 10px;
   margin-bottom: 30px;
   font-size: 12px;
   color: var(--text-muted);
  }

  .logo {
   font-size: 24px;
   font-weight: 700;
   margin-bottom: 10px;
   text-shadow: 0 0 5px var(--primary-glow);
  }

  .subtitle {
   font-size: 14px;
   color: var(--text-muted);
   margin-bottom: 30px;
  }

  /* Typing effect for subtitle */
  .typewriter {
   display: inline-block;
   overflow: hidden;
   white-space: nowrap;
   border-right: 2px solid var(--primary);
   animation: typing 1.5s steps(30, end), blink-caret .75s step-end infinite;
  }

  @keyframes typing {
   from { width: 0 }
   to { width: 100% }
  }

  @keyframes blink-caret {
   from, to { border-color: transparent }
   50% { border-color: var(--primary); }
  }

  /* Inputs */
  .input-group {
   margin-bottom: 25px;
   position: relative;
  }

  .input-group label {
   display: block;
   font-size: 13px;
   margin-bottom: 8px;
   color: var(--text-muted);
  }

  .input-group label::before {
   content: '>';
   margin-right: 8px;
   color: var(--primary);
  }

  .input-group input {
   width: 100%;
   padding: 12px 15px;
   background: #020202;
   border: 1px solid var(--border-color);
   color: var(--text-main);
   font-family: 'Fira Code', monospace;
   font-size: 14px;
   outline: none;
   transition: all 0.2s ease;
  }

  .input-group input:focus {
   border-color: var(--primary);
   box-shadow: 0 0 10px var(--primary-dim);
  }

  /* Button */
  .btn-login {
   width: 100%;
   padding: 14px;
   margin-top: 15px;
   background: transparent;
   border: 1px solid var(--primary);
   color: var(--primary);
   font-size: 15px;
   font-weight: 600;
   font-family: 'Fira Code', monospace;
   cursor: pointer;
   text-transform: uppercase;
   letter-spacing: 2px;
   transition: all 0.2s ease;
   position: relative;
   overflow: hidden;
  }

  .btn-login:hover {
   background: var(--primary);
   color: var(--bg-color);
   box-shadow: 0 0 15px var(--primary-glow);
  }

  .btn-login:disabled {
   border-color: var(--text-muted);
   color: var(--text-muted);
   cursor: not-allowed;
  }

  .btn-login:disabled:hover {
   background: transparent;
   box-shadow: none;
  }

  /* Loader */
  .loader {
   display: none;
   font-size: 14px;
  }
  
  .loader::after {
   content: '...';
   animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
   0%, 20% { content: ''; }
   40% { content: '.'; }
   60% { content: '..'; }
   80%, 100% { content: '...'; }
  }

  /* Error Message */
  .error-msg {
   color: var(--error);
   font-size: 13px;
   margin-top: 20px;
   min-height: 20px;
   opacity: 0;
   text-shadow: 0 0 5px rgba(255, 0, 60, 0.4);
  }

  .error-msg.visible {
   opacity: 1;
  }

  /* Footer */
  .footer {
   position: absolute;
   bottom: 20px;
   width: 100%;
   text-align: center;
   font-size: 12px;
   color: var(--text-muted);
   z-index: 10;
  }

  .footer a {
   color: var(--primary);
   text-decoration: none;
  }

  .footer a:hover {
   text-decoration: underline;
   text-shadow: 0 0 5px var(--primary-glow);
  }
 </style>
</head>
<body>

 <div class="login-wrapper">
  <div class="login-card">
   <div class="terminal-header">
    <span>root@ease-Desk:~# ./auth_gateway.sh</span>
    <span id="clock">00:00:00</span>
   </div>
   
   <div class="logo">EASE_DESK // SECURE_AUTH</div>
   <div class="subtitle"><span class="typewriter">Initializing connection protocol...</span></div>

   <form id="loginForm">
    <div class="input-group">
     <label for="username">TARGET_USER</label>
     <input type="text" id="username" autocomplete="username" spellcheck="false" required autofocus>
    </div>
    
    <div class="input-group">
     <label for="password">ACCESS_TOKEN</label>
     <input type="password" id="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
     <span id="btnText">EXECUTE_LOGIN</span>
     <span class="loader" id="loader">AUTHENTICATING</span>
    </button>

    <div class="error-msg" id="errorMsg">[!] ERROR: INVALID CREDENTIALS_DETECTED</div>
   </form>
  </div>
 </div>

 <div class="footer">
  ease-Desk v2.0 | <a href="https://charlietech.site" target="_blank">charlietech.site</a>
 </div>

 <script>
  // Simple Clock
  setInterval(() => {
   const d = new Date();
   document.getElementById('clock').innerText = d.toTimeString().split(' ')[0];
  }, 1000);

  // Login Logic
  document.getElementById('loginForm').addEventListener('submit', function(e) {
   e.preventDefault();
   
   const u = document.getElementById('username').value;
   const p = document.getElementById('password').value;
   const btnText = document.getElementById('btnText');
   const loader = document.getElementById('loader');
   const errorMsg = document.getElementById('errorMsg');
   const btn = document.getElementById('loginBtn');

   // UI Loading state
   btnText.style.display = 'none';
   loader.style.display = 'inline-block';
   errorMsg.classList.remove('visible');
   btn.disabled = true;

   const xhr = new XMLHttpRequest();
   xhr.open("GET", "/auth_check", true);
   xhr.setRequestHeader("Authorization", "Basic " + btoa(u + ":" + p));
   
   xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
     if ((xhr.status >= 200 && xhr.status < 300) || xhr.status === 404) {
      document.cookie = "easedesk_auth=" + btoa(u + ":" + p) + "; path=/; max-age=86400; SameSite=Strict";
      sessionStorage.setItem('easedesk_session', '1');
      sessionStorage.setItem('easedesk_user', u);
      sessionStorage.setItem('easedesk_pass', p);
      
      // Simulate connection delay for effect
      btnText.style.display = 'none';
      loader.innerText = "ACCESS GRANTED";
      setTimeout(() => {
       window.location.replace('/desktop.html');
      }, 500);
     } else {
      btnText.style.display = 'inline-block';
      loader.style.display = 'none';
      btn.disabled = false;
      errorMsg.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
     }
    }
   };

   xhr.onerror = function() {
    btnText.style.display = 'inline-block';
    loader.style.display = 'none';
    btn.disabled = false;
    errorMsg.innerText = "[!] ERROR: NETWORK_UNREACHABLE";
    errorMsg.classList.add('visible');
   };

   xhr.send();
  });
 </script>
</body>
</html>
