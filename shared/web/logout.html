<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ease-Desk | Logout</title>
</head>
<body>
    <script>
        // Clear the auth cookie by setting its expiration to the past
        document.cookie = "easedesk_auth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        
        // Also send a fake basic auth request to clear any leftover browser credentials cache
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "/", true, "logout", "logout" + Math.random());
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                window.location.replace("/");
            }
        };
        xhr.onerror = function() { window.location.replace("/"); };
        xhr.send();
    </script>
</body>
</html>
